name: Source check

# Monthly link-health + content-diff run over src/data/sources.ts.
# Commits the report and updated snapshots to a rolling branch and opens (or
# updates) a PR whose body is the findings summary. The PR's Vercel preview
# renders the full report at /source-report.
#
# Requires: Settings → Actions → General → "Allow GitHub Actions to create
# and approve pull requests".

on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - run: npm ci

      - name: Run source check
        run: npm run check

      - name: Set run date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Open or update PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/source-check
          delete-branch: true
          add-paths: |
            pipeline/reports/*.md
            pipeline/reports/*.json
            pipeline/data/snapshots/**
          commit-message: "Source check report ${{ steps.date.outputs.today }}"
          title: "Source check: ${{ steps.date.outputs.today }}"
          body-path: pipeline/reports/pr-body.md
          labels: source-check
