  - region: Turkiye
    url: https://www.mfa.gov.tr/visa-information-for-foreigners.en.mfa
    verdict: rule-change
    ruleChange: 16
    by: ai-assisted
    notes: >-
      Bhutan, Solomon Islands, Vanuatu: the 15-day visa is gone and "Ordinary
      passport holders who hold a valid Schengen members or USA, UK, Ireland
      visa or residence permit may get their visas via the website
      www.evisa.gov.tr provided that they meet certain conditions" was added.
      Confirmed on the live page 2026-11-23.
