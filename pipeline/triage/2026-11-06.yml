    url: https://www.mfa.gov.tr/visa-information-for-foreigners.en.mfa
    verdict: unclear
    by: ai-assisted
    notes: >-
      South Africa's paragraph: the e-Visa went from "one month period single
      entry visas via the website www.evisa.gov.tr" to "multiple entry e-visas
      that allow a 30-day stay via the website https://dtvgroup.com.tr". The
      30-day stay is unchanged, but turkiye.ts ZA models a single-entry e-Visa
      from evisa.gov.tr and quotes the old wording. Settle by reading the
      South Africa paragraph on the live MFA page.
